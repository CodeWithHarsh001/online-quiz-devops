
name: Online Quiz CI-CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests
        run: python -m pytest -v

  docker-build:
    name: Build and Test Docker Container
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t online-quiz-devops:latest .

      - name: Start Docker Container
        run: docker run -d --name quiz-test -p 5000:5000 online-quiz-devops:latest

      - name: Test Application Health
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:5000/ > /dev/null; then
              echo "Application health check passed!"
              exit 0
            fi
            sleep 2
          done
          docker logs quiz-test
          echo "Application health check failed!"
          exit 1

      - name: Cleanup Docker Container
        if: always()
        run: docker rm -f quiz-test || true

  docker-publish:
    name: Publish Image to Docker Hub
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            codewithharsh01/online-quiz-devops:latest
            codewithharsh01/online-quiz-devops:sha-${{ github.sha }}
